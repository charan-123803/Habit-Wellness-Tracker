<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | LifeSync</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg lifesync-nav py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand nav-brand-logo d-flex align-items-center gap-2" href="dashboard.html">
        <i class="fas fa-heart-pulse text-danger"></i> LifeSync
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <button class="btn btn-sm theme-toggle-btn p-2"><i class="fas fa-moon"></i></button>
        <span class="user-name-text fw-semibold">John Doe</span>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <div class="row g-4">
      
      <!-- Sidebar -->
      <div class="col-lg-2">
        <div class="glass-card p-3 sticky-top" style="top: 80px;">
          <div class="nav flex-column nav-pills gap-1">
            <a class="nav-link" href="dashboard.html"><i class="fas fa-th-large me-2"></i> Dashboard</a>
            <a class="nav-link" href="habits.html"><i class="fas fa-check-circle me-2"></i> Habits</a>
            <a class="nav-link" href="wellness.html"><i class="fas fa-heartbeat me-2"></i> Wellness</a>
            <a class="nav-link" href="profile.html active"><i class="fas fa-user me-2"></i> Profile</a>
            <a class="nav-link" href="settings.html"><i class="fas fa-cog me-2"></i> Settings</a>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-10">
        
        <h3 class="fw-bold mb-1">User Profile & Bio</h3>
        <p class="text-muted mb-4">Manage personal information, body metrics, and security credentials.</p>

        <div class="row g-4">
          
          <div class="col-lg-4">
            <div class="glass-card p-4 text-center">
              <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=250&q=80" class="rounded-circle mb-3 border border-3 border-primary" width="110" height="110" alt="Avatar">
              <h4 class="fw-bold mb-1">John Doe</h4>
              <p class="text-muted small mb-3">john@example.com</p>
              <span class="badge bg-primary px-3 py-2 rounded-pill">Level 3 Tracker • 480 XP</span>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="glass-card p-4">
              <h5 class="fw-bold mb-3"><i class="fas fa-user-edit text-primary me-2"></i> Personal & Physical Metrics</h5>

              <form id="profileForm" onsubmit="saveProfile(event)">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" id="profName" class="form-control" value="John Doe" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" id="profEmail" class="form-control" value="john@example.com" required readonly>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">Height (cm)</label>
                    <input type="number" id="profHeight" class="form-control" value="175">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">Weight (kg)</label>
                    <input type="number" id="profWeight" class="form-control" value="70">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">Age</label>
                    <input type="number" id="profAge" class="form-control" value="26">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Language</label>
                    <select id="profLang" class="form-select">
                      <option value="en" selected>English</option>
                      <option value="es">Spanish</option>
                      <option value="fr">French</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Time Zone</label>
                    <select id="profTZ" class="form-select">
                      <option value="UTC" selected>UTC (Coordinated Universal Time)</option>
                      <option value="EST">EST (Eastern Standard Time)</option>
                      <option value="PST">PST (Pacific Standard Time)</option>
                    </select>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mt-4">Save Profile Changes</button>
              </form>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script>
    function saveProfile(e) {
      e.preventDefault();
      showToast('Profile updated successfully!');
    }
  </script>
</body>
</html>
