<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Goals | LifeSync</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg lifesync-nav py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand nav-brand-logo d-flex align-items-center gap-2" href="dashboard.html">
        <i class="fas fa-heart-pulse text-danger"></i> LifeSync
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <button class="btn btn-sm theme-toggle-btn p-2"><i class="fas fa-moon"></i></button>
        <span class="user-name-text fw-semibold">John Doe</span>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <div class="row g-4">
      
      <!-- Sidebar -->
      <div class="col-lg-2">
        <div class="glass-card p-3 sticky-top" style="top: 80px;">
          <div class="nav flex-column nav-pills gap-1">
            <a class="nav-link" href="dashboard.html"><i class="fas fa-th-large me-2"></i> Dashboard</a>
            <a class="nav-link" href="habits.html"><i class="fas fa-check-circle me-2"></i> Habits</a>
            <a class="nav-link" href="wellness.html"><i class="fas fa-heartbeat me-2"></i> Wellness</a>
            <a class="nav-link" href="sleep.html"><i class="fas fa-moon me-2"></i> Sleep</a>
            <a class="nav-link" href="exercise.html"><i class="fas fa-running me-2"></i> Exercise</a>
            <a class="nav-link" href="meals.html"><i class="fas fa-utensils me-2"></i> Meals</a>
            <a class="nav-link" href="mood.html"><i class="fas fa-smile me-2"></i> Mood</a>
            <a class="nav-link active" href="goals.html"><i class="fas fa-bullseye me-2"></i> Goals</a>
            <a class="nav-link" href="reports.html"><i class="fas fa-file-alt me-2"></i> Reports</a>
            <a class="nav-link" href="calendar.html"><i class="fas fa-calendar-alt me-2"></i> Calendar</a>
            <a class="nav-link" href="community.html"><i class="fas fa-users me-2"></i> Community</a>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-10">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h3 class="fw-bold mb-1">Target Goals Tracker</h3>
            <p class="text-muted mb-0">Set long-term milestones for weight, reading, coding, and exercise.</p>
          </div>
          <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#goalModal">
            <i class="fas fa-plus me-2"></i> Create New Goal
          </button>
        </div>

        <div id="goalsGrid" class="row g-4">
          <!-- Dynamic rendering from JS -->
        </div>

      </div>
    </div>
  </div>

  <!-- Create Goal Modal -->
  <div class="modal fade" id="goalModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card border-0">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Create Target Goal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="goalForm" onsubmit="saveGoal(event)">
            <div class="mb-3">
              <label class="form-label fw-semibold">Goal Title</label>
              <input type="text" id="goalTitle" class="form-control" placeholder="e.g. Lose 5kg Body Weight" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Category</label>
              <select id="goalCategory" class="form-select">
                <option value="Weight Loss">Weight Loss</option>
                <option value="Weight Gain">Weight Gain</option>
                <option value="Read Books">Read Books</option>
                <option value="Coding Practice">Coding Practice</option>
                <option value="Meditation">Meditation</option>
                <option value="Exercise">Exercise</option>
              </select>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label fw-semibold">Target Value</label>
                <input type="number" id="goalTarget" class="form-control" value="68" step="0.1" required>
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold">Current Value</label>
                <input type="number" id="goalCurrent" class="form-control" value="70" step="0.1" required>
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold">Unit</label>
                <input type="text" id="goalUnit" class="form-control" placeholder="kg / books / hrs" value="kg">
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold">Deadline</label>
                <input type="date" id="goalDeadline" class="form-control" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100">Create Goal</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script>
    let goals = getCached('goals', MockData.goals);

    function renderGoals() {
      const grid = document.getElementById('goalsGrid');
      grid.innerHTML = '';

      goals.forEach(g => {
        const pct = Math.min(100, Math.round((g.current / g.target) * 100));
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';
        col.innerHTML = `
          <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
            <div>
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-primary-subtle text-primary">${g.category}</span>
                <span class="badge bg-success-subtle text-success">${pct}% Completed</span>
              </div>
              <h5 class="fw-bold mb-3">${g.title}</h5>
              <div class="d-flex justify-content-between small text-muted mb-1">
                <span>Progress</span>
                <span>${g.current} / ${g.target} ${g.unit}</span>
              </div>
              <div class="progress progress-custom mb-3">
                <div class="progress-bar progress-bar-gradient" style="width: ${pct}%"></div>
              </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
              <button class="btn btn-sm btn-outline-primary" onclick="updateProgress(${g.id})"><i class="fas fa-plus me-1"></i> Update Progress</button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteGoal(${g.id})"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;
        grid.appendChild(col);
      });
    }

    function updateProgress(id) {
      const g = goals.find(item => item.id === id);
      if (g) {
        g.current += 1;
        setCached('goals', goals);
        renderGoals();
        showToast('Progress updated!');
      }
    }

    function deleteGoal(id) {
      goals = goals.filter(g => g.id !== id);
      setCached('goals', goals);
      renderGoals();
      showToast('Goal deleted', 'warning');
    }

    function saveGoal(e) {
      e.preventDefault();
      const title = document.getElementById('goalTitle').value;
      const category = document.getElementById('goalCategory').value;
      const target = parseFloat(document.getElementById('goalTarget').value);
      const current = parseFloat(document.getElementById('goalCurrent').value);
      const unit = document.getElementById('goalUnit').value;

      goals.push({
        id: Date.now(),
        title,
        category,
        target,
        current,
        unit
      });

      setCached('goals', goals);
      renderGoals();
      bootstrap.Modal.getInstance(document.getElementById('goalModal')).hide();
      showToast('Goal created successfully!');
    }

    document.addEventListener('DOMContentLoaded', () => renderGoals());
  </script>
</body>
</html>
