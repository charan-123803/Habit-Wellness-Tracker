<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | LifeSync Habit & Wellness Tracker</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container max-w-500">
    <div class="text-center mb-4">
      <a class="nav-brand-logo fs-2 text-decoration-none" href="index.html">
        <i class="fas fa-heart-pulse text-danger"></i> LifeSync
      </a>
      <p class="text-muted mt-1">Start your journey to better habits and total wellness today.</p>
    </div>

    <div class="glass-card p-4 p-md-5">
      <h3 class="fw-bold mb-4 text-center">Create Account</h3>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" id="regFullName" class="form-control" placeholder="Alex Morgan" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" id="regUsername" class="form-control" placeholder="alex_morgan" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="alex@example.com" required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2">
          Create Account <i class="fas fa-user-plus ms-2"></i>
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Already have an account?</span>
        <a href="login.html" class="fw-bold text-primary text-decoration-none ms-1">Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      showToast('Registration successful! Redirecting to login...', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    }
  </script>
</body>
</html>
