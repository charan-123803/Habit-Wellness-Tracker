<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Tracker | LifeSync</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg lifesync-nav py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand nav-brand-logo d-flex align-items-center gap-2" href="dashboard.html">
        <i class="fas fa-heart-pulse text-danger"></i> LifeSync
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <button class="btn btn-sm theme-toggle-btn p-2"><i class="fas fa-moon"></i></button>
        <span class="user-name-text fw-semibold">John Doe</span>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <div class="row g-4">
      
      <!-- Sidebar -->
      <div class="col-lg-2">
        <div class="glass-card p-3 sticky-top" style="top: 80px;">
          <div class="nav flex-column nav-pills gap-1">
            <a class="nav-link" href="dashboard.html"><i class="fas fa-th-large me-2"></i> Dashboard</a>
            <a class="nav-link" href="habits.html"><i class="fas fa-check-circle me-2"></i> Habits</a>
            <a class="nav-link active" href="wellness.html"><i class="fas fa-heartbeat me-2"></i> Wellness</a>
            <a class="nav-link" href="sleep.html"><i class="fas fa-moon me-2"></i> Sleep</a>
            <a class="nav-link" href="exercise.html"><i class="fas fa-running me-2"></i> Exercise</a>
            <a class="nav-link" href="meals.html"><i class="fas fa-utensils me-2"></i> Meals</a>
            <a class="nav-link" href="mood.html"><i class="fas fa-smile me-2"></i> Mood</a>
            <a class="nav-link" href="goals.html"><i class="fas fa-bullseye me-2"></i> Goals</a>
            <a class="nav-link" href="reports.html"><i class="fas fa-file-alt me-2"></i> Reports</a>
            <a class="nav-link" href="calendar.html"><i class="fas fa-calendar-alt me-2"></i> Calendar</a>
            <a class="nav-link" href="community.html"><i class="fas fa-users me-2"></i> Community</a>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-10">
        
        <h3 class="fw-bold mb-1">Wellness & Vitals Tracker</h3>
        <p class="text-muted mb-4">Log body metrics, vitals, step goals, and daily hydration.</p>

        <div class="row g-4">

          <!-- Water Tracker Card -->
          <div class="col-lg-6">
            <div class="glass-card p-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0"><i class="fas fa-glass-water text-cyan me-2"></i> Water Hydration Tracker</h5>
                <span id="waterGoalText" class="badge bg-cyan-subtle text-cyan fw-bold">2,500 / 3,000 ml</span>
              </div>

              <div class="progress progress-custom mb-3">
                <div id="waterProgressBar" class="progress-bar progress-bar-gradient" style="width: 83%"></div>
              </div>

              <p class="text-muted small">Tap glasses below to add 250ml per glass:</p>
              <div class="water-glass-grid" id="waterGlassGrid">
                <!-- Interactive glass buttons -->
              </div>

              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-outline-info w-50" onclick="addWater(250)"><i class="fas fa-plus me-1"></i> Add Glass (250ml)</button>
                <button class="btn btn-outline-danger w-50" onclick="resetWater()"><i class="fas fa-undo me-1"></i> Reset Hydration</button>
              </div>
            </div>
          </div>

          <!-- Log Vitals Form -->
          <div class="col-lg-6">
            <div class="glass-card p-4">
              <h5 class="fw-bold mb-3"><i class="fas fa-stethoscope text-primary me-2"></i> Log Daily Vitals</h5>
              
              <form id="wellnessForm" onsubmit="saveWellness(event)">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Height (cm)</label>
                    <input type="number" id="vitalHeight" class="form-control" value="175" step="0.1" oninput="calcBMI()" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Weight (kg)</label>
                    <input type="number" id="vitalWeight" class="form-control" value="70" step="0.1" oninput="calcBMI()" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Calculated BMI</label>
                    <input type="text" id="vitalBMI" class="form-control bg-body-tertiary fw-bold text-success" value="22.9 (Normal)" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Blood Pressure (Systolic/Diastolic)</label>
                    <div class="input-group">
                      <input type="number" id="vitalSys" class="form-control" placeholder="120" value="120">
                      <span class="input-group-text">/</span>
                      <input type="number" id="vitalDia" class="form-control" placeholder="80" value="80">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Heart Rate (bpm)</label>
                    <input type="number" id="vitalHR" class="form-control" value="72">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Blood Sugar (mg/dL)</label>
                    <input type="number" id="vitalSugar" class="form-control" value="95">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Oxygen Level SpO2 (%)</label>
                    <input type="number" id="vitalOxygen" class="form-control" value="99">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Daily Steps Goal</label>
                    <input type="number" id="vitalSteps" class="form-control" value="8450">
                  </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mt-4">Save Vitals Record</button>
              </form>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script>
    let currentWater = 2500;
    const targetWater = 3000;

    function renderWaterGlasses() {
      const grid = document.getElementById('waterGlassGrid');
      grid.innerHTML = '';
      const totalGlasses = 12; // 12 x 250ml = 3000ml
      const filledCount = Math.floor(currentWater / 250);

      for (let i = 1; i <= totalGlasses; i++) {
        const glass = document.createElement('div');
        glass.className = `water-glass-icon ${i <= filledCount ? 'filled' : ''}`;
        glass.innerHTML = '<i class="fas fa-glass-water"></i>';
        glass.onclick = () => {
          currentWater = i * 250;
          updateWaterUI();
        };
        grid.appendChild(glass);
      }
    }

    function updateWaterUI() {
      document.getElementById('waterGoalText').textContent = `${currentWater} / ${targetWater} ml`;
      const pct = Math.min(100, Math.round((currentWater / targetWater) * 100));
      document.getElementById('waterProgressBar').style.width = pct + '%';
      renderWaterGlasses();
    }

    function addWater(amount) {
      currentWater = Math.min(targetWater, currentWater + amount);
      updateWaterUI();
      showToast(`+${amount}ml water added! Total: ${currentWater}ml`);
    }

    function resetWater() {
      currentWater = 0;
      updateWaterUI();
      showToast('Water counter reset', 'info');
    }

    function calcBMI() {
      const h = parseFloat(document.getElementById('vitalHeight').value) / 100;
      const w = parseFloat(document.getElementById('vitalWeight').value);
      if (h > 0 && w > 0) {
        const bmi = (w / (h * h)).toFixed(1);
        let category = 'Normal';
        if (bmi < 18.5) category = 'Underweight';
        else if (bmi >= 25) category = 'Overweight';
        document.getElementById('vitalBMI').value = `${bmi} (${category})`;
      }
    }

    function saveWellness(e) {
      e.preventDefault();
      showToast('Vitals and body metrics saved successfully!');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderWaterGlasses();
    });
  </script>
</body>
</html>
