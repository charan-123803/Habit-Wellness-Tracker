<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LifeSync Habit & Wellness Tracker</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container max-w-500">
    <div class="text-center mb-4">
      <a class="nav-brand-logo fs-2 text-decoration-none" href="index.html">
        <i class="fas fa-heart-pulse text-danger"></i> LifeSync
      </a>
      <p class="text-muted mt-1">Welcome back! Sign in to continue your habit streak.</p>
    </div>

    <div class="glass-card p-4 p-md-5">
      <h3 class="fw-bold mb-4 text-center">Sign In</h3>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary"><i class="fas fa-user text-muted"></i></span>
            <input type="text" id="usernameOrEmail" class="form-control" placeholder="admin or john_doe" value="john_doe" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label fw-semibold mb-0">Password</label>
            <a href="#" onclick="showToast('Password reset link sent to registered email', 'info')" class="small text-primary text-decoration-none">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary"><i class="fas fa-lock text-muted"></i></span>
            <input type="password" id="password" class="form-control" value="password123" required>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" checked>
            <label class="form-check-label small" for="rememberMe">Remember Me</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2">
          Sign In <i class="fas fa-sign-in-alt ms-2"></i>
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Don't have an account?</span>
        <a href="register.html" class="fw-bold text-primary text-decoration-none ms-1">Create Account</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('usernameOrEmail').value;
      showToast('Login successful! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }
  </script>
</body>
</html>
